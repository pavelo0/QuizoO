services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizoo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizoo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-quizoo}
    ports:
      - '5432:5432'
    volumes:
      - postgres18_data:/var/lib/postgresql
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-quizoo_user}:${POSTGRES_PASSWORD:-quizoo_pass}@postgres:5432/${POSTGRES_DB:-quizoo}?schema=public
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-local_docker_dev_secret_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost,http://localhost}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-https://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-QuizoO <no-reply@quizoo.local>}
    depends_on:
      - postgres
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - app-network

  frontend-builder:
    build:
      context: ./frontend
    volumes:
      - frontend_dist:/out
    networks:
      - app-network

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend-builder
    networks:
      - app-network

volumes:
  postgres18_data:
  frontend_dist:
  backend_uploads:

networks:
  app-network:
    driver: bridge
